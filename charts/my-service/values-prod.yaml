# ── Production overrides ───────────────────────────────────
# image.tag is updated automatically by Jenkins CI
# Do NOT edit image.tag manually

image:
  repository: registry.example.com/my-org/my-service
  tag: "abc1234f"        # ← Jenkins always writes commit hash here
  pullPolicy: IfNotPresent

replicaCount: 3

ingress:
  enabled: true
  className: nginx
  host: my-service.example.com
  tls:
    enabled: true
    secretName: my-service-tls

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  APP_ENV: production
  LOG_LEVEL: warn