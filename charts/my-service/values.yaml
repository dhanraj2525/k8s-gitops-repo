# Base values — do not deploy directly
# Environment specific files override these

image:
  repository: ghcr.io/dhanraj2525/my-service
  tag: ""                   # Always set by Jenkins
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  host: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5

env:
  APP_ENV: base
  LOG_LEVEL: info

# GHCR pull secret
imagePullSecrets:
  - name: ghcr-secret