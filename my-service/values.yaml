replicaCount: 1

fullnameOverride: "my-service"
image:
  repository: ghcr.io/dhanraj2525/my-service
  pullPolicy: IfNotPresent
  tag: "35"

podLabels:
  app.kubernetes.io/name: my-service
  app: my-service

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""


service:
  type: ClusterIP
  port: 80


# livenessProbe:
#   httpGet:
#     path: /
#     port: http
# readinessProbe:
#   httpGet:
#     path: /
#     port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

